# À chaque push sur main : signe l'extension Firefox (AMO, unlisted) et crée la release
# v<version de package.json> avec firefox.xpi, le fichier lié depuis le README.
# Secrets requis : AMO_JWT_ISSUER, AMO_JWT_SECRET.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # AMO refuse de signer deux fois la même version : on s'arrête net si le tag existe déjà.
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::La release $tag existe déjà. Augmente \"version\" dans package.json avant de merger sur main."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: pnpm check
      - run: pnpm test

      - name: Signer (AMO unlisted)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: pnpm sign

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .output/signed/*.xpi firefox.xpi
          gh release create "${{ steps.version.outputs.tag }}" firefox.xpi \
            --target "$GITHUB_SHA" --generate-notes
